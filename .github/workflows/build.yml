          struct GenericDocPicker: UIViewControllerRepresentable {
              let types: [UTType]
              let onPick: (URL) -> Void
              func makeCoordinator() -> Coordinator { Coordinator(self) }
              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let picker = UIDocumentPickerViewController(forOpeningContentTypes: types, asCopy: true)
                  picker.delegate = context.coordinator
                  return picker
              }
              func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}
              class Coordinator: NSObject, UIDocumentPickerDelegate {
                  var parent: GenericDocPicker
                  init(_ parent: GenericDocPicker) { self.parent = parent }
                  func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                      guard let url = urls.first else { return }
                      parent.onPick(url)
                  }
              }
          }
          EOF

          # 7. Konfigurasi XcodeGen dengan Pustaka ZIPFoundation
          cat << 'EOF' > project.yml
          name: iBaalSign
          options:
            bundleIdPrefix: com.ibaalpremium
          packages:
            ZIPFoundation:
              url: https://github.com/weichsel/ZIPFoundation.git
              from: 0.9.18
          targets:
            iBaalSign:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: Sources
              dependencies:
                - package: ZIPFoundation
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.ibaalpremium.ibaalsign
                MARKETING_VERSION: "2.1"
                CURRENT_PROJECT_VERSION: "4"
                SWIFT_VERSION: "5.0"
                GENERATE_INFOPLIST_FILE: "YES"
                INFOPLIST_KEY_UILaunchStoryboardName: "LaunchScreen"
                INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
                INFOPLIST_KEY_UIFileSharingEnabled: "YES"
                INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "NO"
                ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
          EOF

      - name: Generate Project & Resolve Packages
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 63;/g' iBaalSign.xcodeproj/project.pbxproj
          xcodebuild -resolvePackageDependencies -project iBaalSign.xcodeproj

      - name: Build Application (Release)
        run: |
          xcodebuild clean build \
            -project iBaalSign.xcodeproj \
            -scheme iBaalSign \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Inject Document Types & Package IPA
        run: |
          mkdir -p Payload
          cp -r ./build_output/Build/Products/Release-iphoneos/iBaalSign.app Payload/

          PLIST="Payload/iBaalSign.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:CFBundleTypeName string 'Packages'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:CFBundleTypeRole string 'Editor'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:LSHandlerRank string 'Owner'" "$PLIST"
          
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions:0 string 'ipa'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions:1 string 'tipa'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions:2 string 'dylib'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions:3 string 'deb'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions:4 string 'zip'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions:5 string 'p12'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions:6 string 'mobileprovision'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:LSItemContentTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:LSItemContentTypes:0 string 'public.data'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:LSItemContentTypes:1 string 'public.archive'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:LSItemContentTypes:2 string 'public.content'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:LSItemContentTypes:3 string 'public.item'" "$PLIST"

          chmod +x Payload/iBaalSign.app/iBaalSign
          ldid -S Payload/iBaalSign.app/iBaalSign
          zip -qr iBaalSign.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iBaalSign-v2.1-IPA
          path: iBaalSign.ipa
