name: Build iBaalSign (Fix Liquid Pill Layout)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iBaalSign IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Switch to Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install Dependencies
        run: brew install xcodegen ldid

      - name: Generate App Icon & Assets
        run: |
          pip3 install pillow --break-system-packages
          python3 - << 'EOF'
          from PIL import Image, ImageDraw
          import os, json

          img = Image.new("RGBA", (1024, 1024))
          draw = ImageDraw.Draw(img)

          for y in range(1024):
              r = int(10 + (18 - 10) * (y / 1024))
              g = int(12 + (24 - 12) * (y / 1024))
              b = int(20 + (46 - 20) * (y / 1024))
              draw.line([(0, y), (1024, y)], fill=(r, g, b, 255))

          draw.ellipse([240, 240, 784, 784], fill=(0, 215, 255, 30), outline=(0, 230, 255, 170), width=6)
          draw.rounded_rectangle([470, 260, 554, 650], radius=26, fill=(0, 240, 205, 255))
          draw.polygon([(470, 650), (554, 650), (512, 755)], fill=(0, 240, 205, 255))
          draw.ellipse([496, 735, 528, 767], fill=(10, 12, 20, 255))

          iconset_path = "Sources/Assets.xcassets/AppIcon.appiconset"
          os.makedirs(iconset_path, exist_ok=True)
          img.convert("RGB").save(f"{iconset_path}/icon_1024.png")

          contents = {
              "images": [{"filename": "icon_1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024"}],
              "info": {"author": "xcode", "version": 1}
          }
          with open(f"{iconset_path}/Contents.json", "w") as f:
              json.dump(contents, f, indent=2)
          EOF

      - name: Auto-Generate Source Code (Fixed Liquid Glass UI)
        run: |
          mkdir -p Sources

          # 1. Native LaunchScreen
          cat << 'EOF' > Sources/LaunchScreen.storyboard
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="22505" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="light"/>
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="22504"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <color key="backgroundColor" red="0.04" green="0.05" blue="0.07" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="53" y="375"/>
                  </scene>
              </scenes>
          </document>
          EOF

          # 2. Mach-O Dylib Load Command Injector
          cat << 'EOF' > Sources/MachOInjector.swift
          import Foundation

          enum MachOInjector {
              static func injectDylib(binaryURL: URL, dylibPath: String) -> Bool {
                  guard let handle = try? FileHandle(forUpdating: binaryURL) else { return false }
                  defer { try? handle.close() }
                  
                  let data = handle.readData(ofLength: 4096)
                  guard data.count >= 32 else { return false }
                  
                  var magic: UInt32 = 0
                  (data as NSData).getBytes(&magic, range: NSRange(location: 0, length: 4))
                  guard magic == 0xfeedfacf else { return false }
                  
                  var ncmds: UInt32 = 0
                  var sizeofcmds: UInt32 = 0
                  (data as NSData).getBytes(&ncmds, range: NSRange(location: 16, length: 4))
                  (data as NSData).getBytes(&sizeofcmds, range: NSRange(location: 20, length: 4))
                  
                  let pathBytes = Array(dylibPath.utf8) + [0]
                  let baseCmdSize = 24
                  let fullSize = baseCmdSize + pathBytes.count
                  let alignedCmdSize = UInt32((fullSize + 7) & ~7)
                  
                  var newCmd = Data()
                  var cmdType: UInt32 = 0xc // LC_LOAD_DYLIB
                  var cmdSizeVal: UInt32 = alignedCmdSize
                  var offsetVal: UInt32 = 24
                  var timestampVal: UInt32 = 0
                  var currentVer: UInt32 = 0
                  var compatVer: UInt32 = 0
                  
                  newCmd.append(UnsafeBufferPointer(start: &cmdType, count: 1))
                  newCmd.append(UnsafeBufferPointer(start: &cmdSizeVal, count: 1))
                  newCmd.append(UnsafeBufferPointer(start: &offsetVal, count: 1))
                  newCmd.append(UnsafeBufferPointer(start: &timestampVal, count: 1))
                  newCmd.append(UnsafeBufferPointer(start: &currentVer, count: 1))
                  newCmd.append(UnsafeBufferPointer(start: &compatVer, count: 1))
                  newCmd.append(contentsOf: pathBytes)
                  
                  while newCmd.count < Int(alignedCmdSize) { newCmd.append(0) }
                  
                  let targetOffset = UInt64(32 + sizeofcmds)
                  try? handle.seek(toOffset: targetOffset)
                  try? handle.write(contentsOf: newCmd)
                  
                  var newNcmds = ncmds + 1
                  var newSizeofcmds = sizeofcmds + alignedCmdSize
                  
                  try? handle.seek(toOffset: 16)
                  try? handle.write(contentsOf: Data(bytes: &newNcmds, count: 4))
                  try? handle.seek(toOffset: 20)
                  try? handle.write(contentsOf: Data(bytes: &newSizeofcmds, count: 4))
                  
                  return true
              }
          }
          EOF

          # 3. Core Signing & Repack Engine
          cat << 'EOF' > Sources/SigningEngine.swift
          import Foundation
          import ZIPFoundation

          class SigningEngine {
              static let shared = SigningEngine()
              
              func process(
                  ipaURL: URL,
                  appName: String,
                  bundleID: String,
                  version: String,
                  tweaks: [URL],
                  removeURLSchemes: Bool,
                  removeEmbedded: Bool,
                  enableFileSharing: Bool,
                  p12URL: URL?,
                  provisionURL: URL?,
                  progress: @escaping (String) -> Void,
                  completion: @escaping (Result<URL, Error>) -> Void
              ) {
                  DispatchQueue.global(qos: .userInitiated).async {
                      let fm = FileManager.default
                      let tempDir = fm.temporaryDirectory.appendingPathComponent(UUID().uuidString)
                      
                      do {
                          progress("Mengekstrak paket .IPA...")
                          try fm.createDirectory(at: tempDir, withIntermediateDirectories: true)
                          try fm.unzipItem(at: ipaURL, to: tempDir)
                          
                          let payloadDir = tempDir.appendingPathComponent("Payload")
                          guard let appDirName = try fm.contentsOfDirectory(atPath: payloadDir.path).first(where: { $0.hasSuffix(".app") }) else {
                              throw NSError(domain: "iBaalSign", code: 404, userInfo: [NSLocalizedDescriptionKey: "Folder .app tidak ditemukan di dalam Payload."])
                          }
                          
                          let appDir = payloadDir.appendingPathComponent(appDirName)
                          let plistURL = appDir.appendingPathComponent("Info.plist")
                          
                          progress("Memodifikasi Info.plist...")
                          if var plist = NSDictionary(contentsOf: plistURL) as? [String: Any] {
                              if !appName.isEmpty {
                                  plist["CFBundleDisplayName"] = appName
                                  plist["CFBundleName"] = appName
                              }
                              if !bundleID.isEmpty {
                                  plist["CFBundleIdentifier"] = bundleID
                              }
                              if !version.isEmpty {
                                  plist["CFBundleShortVersionString"] = version
                              }
                              if enableFileSharing {
                                  plist["UIFileSharingEnabled"] = true
                                  plist["LSSupportsOpeningDocumentsInPlace"] = true
                              }
                              if removeURLSchemes {
                                  plist.removeValue(forKey: "CFBundleURLTypes")
                              }
                              (plist as NSDictionary).write(to: plistURL, atomically: true)
                          }
                          
                          if removeEmbedded {
                              progress("Membersihkan PlugIns...")
                              let extensions = ["PlugIns", "Watch", "Extensions"]
                              for ext in extensions {
                                  let extURL = appDir.appendingPathComponent(ext)
                                  if fm.fileExists(atPath: extURL.path) {
                                      try? fm.removeItem(at: extURL)
                                  }
                              }
                          }
                          
                          let frameworksDir = appDir.appendingPathComponent("Frameworks")
                          if !tweaks.isEmpty {
                              progress("Menyuntikkan tweak ke Frameworks...")
                              if !fm.fileExists(atPath: frameworksDir.path) {
                                  try fm.createDirectory(at: frameworksDir, withIntermediateDirectories: true)
                              }
                              
                              let mainExecName = (NSDictionary(contentsOf: plistURL)?["CFBundleExecutable"] as? String) ?? appDirName.replacingOccurrences(of: ".app", with: "")
                              let mainExecURL = appDir.appendingPathComponent(mainExecName)
                              
                              for tweakURL in tweaks {
                                  let destDylib = frameworksDir.appendingPathComponent(tweakURL.lastPathComponent)
                                  if fm.fileExists(atPath: destDylib.path) {
                                      try? fm.removeItem(at: destDylib)
                                  }
                                  try fm.copyItem(at: tweakURL, to: destDylib)
                                  
                                  let loadPath = "@executable_path/Frameworks/\(tweakURL.lastPathComponent)"
                                  _ = MachOInjector.injectDylib(binaryURL: mainExecURL, dylibPath: loadPath)
                              }
                          }
                          
                          if let prov = provisionURL {
                              progress("Menanamkan provision profile...")
                              let destProv = appDir.appendingPathComponent("embedded.mobileprovision")
                              if fm.fileExists(atPath: destProv.path) { try? fm.removeItem(at: destProv) }
                              try? fm.copyItem(at: prov, to: destProv)
                          }
                          
                          progress("Mengemas ulang .IPA...")
                          guard let docs = fm.urls(for: .documentDirectory, in: .userDomainMask).first else {
                              throw NSError(domain: "iBaalSign", code: 500, userInfo: [NSLocalizedDescriptionKey: "Dokumen direktori tidak tersedia."])
                          }
                          
                          let signedDir = docs.appendingPathComponent("Signed")
                          try? fm.createDirectory(at: signedDir, withIntermediateDirectories: true)
                          
                          let safeName = appName.isEmpty ? "App" : appName.replacingOccurrences(of: " ", with: "_")
                          let finalIPA = signedDir.appendingPathComponent("\(safeName)_Signed.ipa")
                          if fm.fileExists(atPath: finalIPA.path) {
                              try? fm.removeItem(at: finalIPA)
                          }
                          
                          try fm.zipItem(at: payloadDir, to: finalIPA, shouldKeepParent: true)
                          try? fm.removeItem(at: tempDir)
                          
                          progress("Selesai!")
                          DispatchQueue.main.async {
                              completion(.success(finalIPA))
                          }
                      } catch {
                          try? fm.removeItem(at: tempDir)
                          DispatchQueue.main.async {
                              completion(.failure(error))
                          }
                      }
                  }
              }
          }
          EOF

          # 4. State & File Manager Engine
          cat << 'EOF' > Sources/AppStateManager.swift
          import SwiftUI
          import UniformTypeIdentifiers

          struct SignedAppItem: Identifiable, Hashable {
              let id = UUID()
              let url: URL
              let name: String
              let size: String
              let date: Date
          }

          class AppStateManager: ObservableObject {
              static let shared = AppStateManager()
              
              @Published var targetIPAName: String = "Belum memilih file .IPA"
              @Published var targetIPAURL: URL? = nil
              
              @Published var appName: String = ""
              @Published var bundleID: String = ""
              @Published var appVersion: String = "1.0"
              
              @Published var installAfterSign: Bool = false
              @Published var enableFileAccess: Bool = true
              @Published var removeURLSchemes: Bool = false
              @Published var removeEmbeddedPlugins: Bool = true
              @Published var autoCleanImports: Bool = true
              
              @Published var injectedTweaks: [URL] = []
              @Published var importedFiles: [URL] = []
              @Published var signedApps: [SignedAppItem] = []
              
              @Published var selectedP12: URL? = nil
              @Published var selectedProvision: URL? = nil
              
              @Published var isProcessing: Bool = false
              @Published var progressMessage: String = ""
              
              @Published var alertTitle: String = ""
              @Published var alertMessage: String = ""
              @Published var showAlert: Bool = false
              
              @Published var exportURL: URL? = nil
              @Published var showShareSheet: Bool = false
              
              init() {
                  refreshAll()
              }
              
              func refreshAll() {
                  refreshDocuments()
                  refreshSignedApps()
                  checkInbox()
              }
              
              func refreshDocuments() {
                  let fm = FileManager.default
                  guard let docs = fm.urls(for: .documentDirectory, in: .userDomainMask).first else { return }
                  if let urls = try? fm.contentsOfDirectory(at: docs, includingPropertiesForKeys: nil, options: [.skipsHiddenFiles]) {
                      self.importedFiles = urls.filter { 
                          !$0.lastPathComponent.hasPrefix("Inbox") && 
                          !$0.lastPathComponent.hasPrefix("Signed") 
                      }
                  }
              }
              
              func refreshSignedApps() {
                  let fm = FileManager.default
                  guard let docs = fm.urls(for: .documentDirectory, in: .userDomainMask).first else { return }
                  let signedDir = docs.appendingPathComponent("Signed")
                  if let urls = try? fm.contentsOfDirectory(at: signedDir, includingPropertiesForKeys: [.fileSizeKey, .creationDateKey], options: [.skipsHiddenFiles]) {
                      self.signedApps = urls.filter { $0.pathExtension.lowercased() == "ipa" }.map { url in
                          let res = try? url.resourceValues(forKeys: [.fileSizeKey, .creationDateKey])
                          let bytes = Int64(res?.fileSize ?? 0)
                          let date = res?.creationDate ?? Date()
                          return SignedAppItem(
                              url: url,
                              name: url.deletingPathExtension().lastPathComponent,
                              size: ByteCountFormatter.string(fromByteCount: bytes, countStyle: .file),
                              date: date
                          )
                      }.sorted { $0.date > $1.date }
                  }
              }
              
              func checkInbox() {
                  let fm = FileManager.default
                  guard let docs = fm.urls(for: .documentDirectory, in: .userDomainMask).first else { return }
                  let inboxURL = docs.appendingPathComponent("Inbox")
                  if let inboxFiles = try? fm.contentsOfDirectory(at: inboxURL, includingPropertiesForKeys: nil, options: [.skipsHiddenFiles]) {
                      for file in inboxFiles { handleIncomingURL(file) }
                  }
              }
              
              func handleIncomingURL(_ url: URL) {
                  let secured = url.startAccessingSecurityScopedResource()
                  defer { if secured { url.stopAccessingSecurityScopedResource() } }
                  
                  let fm = FileManager.default
                  guard let docs = fm.urls(for: .documentDirectory, in: .userDomainMask).first else { return }
                  let destURL = docs.appendingPathComponent(url.lastPathComponent)
                  
                  do {
                      if url.path != destURL.path {
                          if fm.fileExists(atPath: destURL.path) { try fm.removeItem(at: destURL) }
                          try fm.copyItem(at: url, to: destURL)
                          if url.path.contains("/Inbox/") { try? fm.removeItem(at: url) }
                      }
                      
                      let ext = destURL.pathExtension.lowercased()
                      DispatchQueue.main.async {
                          self.refreshDocuments()
                          if ext == "ipa" || ext == "tipa" {
                              self.targetIPAURL = destURL
                              self.targetIPAName = destURL.lastPathComponent
                              let rawName = destURL.deletingPathExtension().lastPathComponent
                              self.appName = rawName
                              self.bundleID = "com.ibaalsign." + rawName.lowercased().filter { $0.isLetter || $0.isNumber }
                              self.showAlert(title: "Target Siap! 🚀", message: "\(destURL.lastPathComponent) terpilih.")
                          } else if ext == "dylib" || ext == "deb" {
                              if !self.injectedTweaks.contains(destURL) {
                                  self.injectedTweaks.append(destURL)
                              }
                              self.showAlert(title: "Tweak Diterima! 💉", message: "\(destURL.lastPathComponent) siap disuntikkan.")
                          } else if ext == "p12" {
                              self.selectedP12 = destURL
                              self.showAlert(title: "Sertifikat P12 🔑", message: "Sertifikat P12 berhasil dipilih.")
                          } else if ext == "mobileprovision" {
                              self.selectedProvision = destURL
                              self.showAlert(title: "Provision Profile 📄", message: "Provisioning profile terpasang.")
                          }
                      }
                  } catch {
                      DispatchQueue.main.async {
                          self.showAlert(title: "Gagal Mengimpor", message: error.localizedDescription)
                      }
                  }
              }
              
              func startProcessing() {
                  guard let ipa = targetIPAURL else {
                      showAlert(title: "Peringatan", message: "Silakan pilih berkas target .IPA terlebih dahulu.")
                      return
                  }
                  
                  self.isProcessing = true
                  self.progressMessage = "Memulai..."
                  
                  SigningEngine.shared.process(
                      ipaURL: ipa,
                      appName: appName,
                      bundleID: bundleID,
                      version: appVersion,
                      tweaks: injectedTweaks,
                      removeURLSchemes: removeURLSchemes,
                      removeEmbedded: removeEmbeddedPlugins,
                      enableFileSharing: enableFileAccess,
                      p12URL: selectedP12,
                      provisionURL: selectedProvision,
                      progress: { msg in
                          DispatchQueue.main.async { self.progressMessage = msg }
                      },
                      completion: { result in
                          self.isProcessing = false
                          switch result {
                          case .success(let finalURL):
                              self.refreshSignedApps()
                              self.exportURL = finalURL
                              self.showShareSheet = true
                          case .failure(let err):
                              self.showAlert(title: "Gagal Memproses", message: err.localizedDescription)
                          }
                      }
                  )
              }
              
              func showAlert(title: String, message: String) {
                  self.alertTitle = title
                  self.alertMessage = message
                  self.showAlert = true
              }
          }
          EOF

          # 5. App Entry Point
          cat << 'EOF' > Sources/iBaalSignApp.swift
          import SwiftUI

          class AppDelegate: NSObject, UIApplicationDelegate {
              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey : Any] = [:]) -> Bool {
                  AppStateManager.shared.handleIncomingURL(url)
                  return true
              }
          }

          @main
          struct iBaalSignApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate
              @StateObject var state = AppStateManager.shared
              
              var body: some Scene {
                  WindowGroup {
                      MainTabView()
                          .environmentObject(state)
                          .onOpenURL { state.handleIncomingURL($0) }
                          .onReceive(NotificationCenter.default.publisher(for: UIApplication.didBecomeActiveNotification)) { _ in
                              state.checkInbox()
                          }
                  }
              }
          }
          EOF

          # 6. Perbaikan Antarmuka Liquid Glass (Terkunci Presisi di Bawah)
          cat << 'EOF' > Sources/MainViews.swift
          import SwiftUI
          import UniformTypeIdentifiers

          extension Color {
              static let lcsOled = Color(red: 0.04, green: 0.05, blue: 0.07)
              static let lcsCard = Color(red: 0.09, green: 0.10, blue: 0.14)
              static let lcsCyan = Color(red: 0.0, green: 0.88, blue: 0.98)
              static let lcsAccent = Color(red: 0.15, green: 0.55, blue: 1.0)
          }

          struct ActivityView: UIViewControllerRepresentable {
              let activityItems: [Any]
              func makeUIViewController(context: Context) -> UIActivityViewController {
                  UIActivityViewController(activityItems: activityItems, applicationActivities: nil)
              }
              func updateUIViewController(_ uiViewController: UIActivityViewController, context: Context) {}
          }

          struct LiquidCard<Content: View>: View {
              let content: Content
              init(@ViewBuilder content: () -> Content) { self.content = content() }
              
              var body: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      content
                  }
                  .padding(18)
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .background(
                      RoundedRectangle(cornerRadius: 24)
                          .fill(
                              LinearGradient(
                                  colors: [Color.white.opacity(0.06), Color.white.opacity(0.02)],
                                  startPoint: .topLeading,
                                  endPoint: .bottomTrailing
                              )
                          )
                          .background(Color.lcsCard.opacity(0.92))
                  )
                  .overlay(
                      RoundedRectangle(cornerRadius: 24)
                          .stroke(
                              LinearGradient(
                                  colors: [Color.white.opacity(0.22), Color.white.opacity(0.03)],
                                  startPoint: .top,
                                  endPoint: .bottom
                              ),
                              lineWidth: 1
                          )
                  )
                  .shadow(color: Color.black.opacity(0.4), radius: 12, y: 6)
              }
          }

          struct MainTabView: View {
              @EnvironmentObject var state: AppStateManager
              @State private var currentTab = 0
              @Namespace private var tabNamespace
              
              let tabs = [
                  ("cube.box.fill", "Projects"),
                  ("square.stack.3d.up.fill", "Apps"),
                  ("folder.fill", "Files"),
                  ("gearshape.fill", "Settings")
              ]
              
              var body: some View {
                  ZStack(alignment: .bottom) {
                      Color.lcsOled.ignoresSafeArea()
                      
                      TabView(selection: $currentTab) {
                          ProjectsView().tag(0)
                          AppsView().tag(1)
                          FilesView().tag(2)
                          SettingsView().tag(3)
                      }
                      .tabViewStyle(PageTabViewStyle(indexDisplayMode: .never))
                      
                      // Floating Bottom Bar Presisi
                      HStack(spacing: 6) {
                          ForEach(0..<tabs.count, id: \.self) { idx in
                              let tab = tabs[idx]
                              let isSelected = currentTab == idx
                              
                              Button {
                                  withAnimation(.spring(response: 0.35, dampingFraction: 0.72)) {
                                      currentTab = idx
                                  }
                              } label: {
                                  VStack(spacing: 3) {
                                      Image(systemName: tab.0)
                                          .font(.system(size: isSelected ? 17 : 15, weight: isSelected ? .bold : .regular))
                                          .foregroundColor(isSelected ? .lcsCyan : .gray)
                                      
                                      Text(tab.1)
                                          .font(.system(size: 10, weight: isSelected ? .bold : .medium))
                                          .foregroundColor(isSelected ? .white : .gray.opacity(0.8))
                                  }
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 48)
                                  .background(
                                      ZStack {
                                          if isSelected {
                                              Capsule()
                                                  .fill(
                                                      LinearGradient(
                                                          colors: [Color.lcsCyan.opacity(0.25), Color.lcsAccent.opacity(0.12)],
                                                          startPoint: .topLeading,
                                                          endPoint: .bottomTrailing
                                                      )
                                                  )
                                                  .matchedGeometryEffect(id: "liquidPill", in: tabNamespace)
                                                  .overlay(
                                                      Capsule().stroke(Color.lcsCyan.opacity(0.65), lineWidth: 1)
                                                  )
                                                  .shadow(color: Color.lcsCyan.opacity(0.4), radius: 8, y: 2)
                                          }
                                      }
                                  )
                              }
                              .buttonStyle(PlainButtonStyle())
                          }
                      }
                      .padding(6)
                      .frame(height: 60)
                      .background(
                          Capsule()
                              .fill(Color(red: 0.08, green: 0.09, blue: 0.14).opacity(0.92))
                              .background(Capsule().fill(Color.white.opacity(0.04)).blur(radius: 20))
                      )
                      .overlay(
                          Capsule().stroke(
                              LinearGradient(
                                  colors: [Color.white.opacity(0.2), Color.white.opacity(0.04)],
                                  startPoint: .top,
                                  endPoint: .bottom
                              ),
                              lineWidth: 1
                          )
                      )
                      .shadow(color: Color.black.opacity(0.6), radius: 24, y: 12)
                      .padding(.horizontal, 20)
                      .padding(.bottom, 10)
                      
                      // HUD Indikator Proses
                      if state.isProcessing {
                          ZStack {
                              Color.black.opacity(0.7).ignoresSafeArea()
                              VStack(spacing: 16) {
                                  ProgressView()
                                      .progressViewStyle(CircularProgressViewStyle(tint: .lcsCyan))
                                      .scaleEffect(1.6)
                                  Text(state.progressMessage)
                                      .font(.system(size: 14, weight: .bold))
                                      .foregroundColor(.white)
                              }
                              .padding(28)
                              .background(Color.lcsCard)
                              .cornerRadius(24)
                              .overlay(RoundedRectangle(cornerRadius: 24).stroke(Color.white.opacity(0.12), lineWidth: 1))
                          }
                      }
                  }
                  .sheet(isPresented: $state.showShareSheet) {
                      if let url = state.exportURL {
                          ActivityView(activityItems: [url])
                      }
